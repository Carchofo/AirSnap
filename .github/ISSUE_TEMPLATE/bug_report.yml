name: 🐛 Reportar un bug
description: Cuéntanos qué falla para que el equipo (humano o robot) pueda arreglarlo
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: Qué pasa
      description: Describe el problema con el máximo detalle
      placeholder: "Al pulsar el botón del casco bluetooth la app hace dos fotos en vez de una..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Pasos para reproducirlo
      placeholder: |
        1. Abro la app
        2. Conecto los auriculares
        3. Pulso el botón de volumen
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Qué esperabas que pasara
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Móvil y versión de Android
      placeholder: "Realme 14 Pro+, Android 15"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión de AirSnap
      placeholder: "1.0.10 (Ajustes → Acerca de)"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs o capturas (opcional)
