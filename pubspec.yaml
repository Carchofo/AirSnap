name: airsnap
description: AirSnap — Remote camera shutter via Bluetooth with full i18n support.
publish_to: "none"
version: 1.0.10+10

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Internacionalización
  intl: ^0.20.2

  # Estado reactivo
  provider: ^6.1.2

  # Cámara con filtros en tiempo real
  camerawesome: ^2.5.0

  # Permisos
  permission_handler: ^11.3.1

  # Icono adaptativo y utilidades
  cupertino_icons: ^1.0.8

  # Update checker
  http: ^1.2.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
